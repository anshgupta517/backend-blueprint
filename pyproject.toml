[project]
name = "my-backend"
version = "0.1.0"
description = "Production-ready FastAPI boilerplate"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    
    # Rate limiting
    "slowapi>=0.1.9",

    # Database (async)
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",          # Async PostgreSQL driver
    "alembic>=1.13.0",          # Database migrations

    # Cache
    "redis[hiredis]>=5.0.0",

    # Background jobs
    "celery[redis]>=5.3.0",
    "flower>=2.0.0",

    # Config & validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0", # .env file loading
    "email-validator>=2.1.0",   

    # Auth
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",

    # Observability
    "prometheus-fastapi-instrumentator>=6.1.0",
    "sentry-sdk[fastapi]>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",            # Async test client for FastAPI
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
