# docker-compose.yml
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine       
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data   # persist data between restarts
    ports:
      - "5433:5432"                 # expose for local psql access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

     # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data     # persist cache across restarts (optional but good)

   # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
      build:
        context: .
        dockerfile: Dockerfile
      restart: unless-stopped
      env_file: .env
      environment:
        POSTGRES_HOST: db
        REDIS_HOST: redis
      command: celery -A app.worker.celery_app worker --loglevel=info --queues=default
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      volumes:
        - .:/app

  # ── Flower (Celery Monitoring) ─────────────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
    command: celery -A app.worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker
    volumes:
      - .:/app      

  # ── FastAPI App ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env                  # reads all vars from your .env file
    environment:
      # Override just the DB host — inside Docker network, use service name
      # not localhost (localhost inside the container = the container itself)
      POSTGRES_HOST: db             # 'db' is the service name above
      REDIS_HOST: redis            # 'redis' is the service name above
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy  
      redis:
        condition: service_healthy  
    volumes:
      - .:/app                      # mount code for hot reload in development

